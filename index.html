<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Harvest KDS</title><style>*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0}
:root{--bg:#fff;--surface:#F5F5F2;--line:#E1E0DB;--ink:#161616;--mute:#6E6E69;--prob:#C2432D;--prob-tint:#FAEAE6;--sol:#2E7D5B;--sol-tint:#E4F1EA;--font:"Avenir Next","Avenir","Segoe UI",system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 15px;font-weight:500}
button:hover{border-color:var(--ink)}:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ghost{background:transparent;border-color:transparent;color:var(--mute);padding:5px 9px}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
input:focus,textarea:focus,select:focus{border-color:var(--ink);outline:none}textarea{resize:vertical}
h1,h2{font-weight:700;margin:0;line-height:1.15;letter-spacing:-.015em}h2{font-size:22px}
header{border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font:600 19px/1 var(--font)}.logo svg{width:22px;height:22px}.spacer{flex:1}
main{max-width:640px;margin:0 auto;padding:20px 16px 60px;display:grid;gap:18px}
.card{background:var(--surface);border-radius:18px;padding:22px;display:grid;gap:14px}.empty{text-align:center}.muted{color:var(--mute)}
.help{color:var(--mute);font-size:16px}.eyebrow{display:none}
.phead{display:grid;gap:6px}.ptitle{font-size:28px;letter-spacing:-.025em;font-weight:800}
.pgroup{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pgname{font-weight:700;background:var(--surface);padding:6px 14px;border-radius:999px}
.pgroups{display:grid;gap:10px}.pgroups button{padding:16px;font-size:18px;border-radius:14px;text-align:left;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}.pgroups button.mine{border:2px solid var(--ink);font-weight:700}.pgroups small{font-size:13px;color:var(--mute);font-weight:500}
.five{display:grid;gap:12px}.charsel{display:grid;gap:6px}
.lrow{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:14px 12px;border-radius:16px;background:var(--surface);position:relative}
.lrow::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:3px;background:var(--kc,transparent)}
.lrow.k-problem{--kc:var(--prob)}.lrow.k-solution{--kc:var(--sol)}
.num{font:700 22px/1 var(--font);color:var(--ink);text-align:center;padding-top:8px}
.lbody{display:grid;gap:10px;min-width:0}.lmeta{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}.lmeta .mini:last-child{grid-column:1/-1}
.mini{display:grid;gap:5px;font:500 13px/1.2 var(--font);color:var(--mute)}.mini select,.mini input{color:var(--ink)}
.segs{display:flex;gap:6px}.seg{flex:1;border-radius:999px;padding:12px;font-weight:500;color:var(--mute)}
.seg.problem[aria-pressed="true"]{background:var(--prob-tint);border-color:var(--prob);color:var(--prob);font-weight:700}
.seg.solution[aria-pressed="true"]{background:var(--sol-tint);border-color:var(--sol);color:var(--sol);font-weight:700}
.pst{font-size:13px;color:var(--mute);min-height:16px}.pst.ok{color:var(--sol)}.pst.err{color:var(--prob)}
.pprog{display:flex;align-items:center;gap:10px;font-weight:700}.pbar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--sol);transition:width .5s cubic-bezier(.16,1,.3,1)}
.rootpick{display:flex;flex-wrap:wrap;gap:6px}.rootpick button{border-radius:999px;padding:8px 14px;font-size:15px;color:var(--mute);background:#fff}.rootpick button[aria-pressed="true"]{background:#EAD5A6;border-color:#A2761F;color:var(--ink);font-weight:700}
.savebig{width:100%;padding:16px;font-size:18px;font-weight:700;border-radius:14px;background:var(--ink);color:#fff;border-color:var(--ink)}.savebig.ok{background:var(--sol);border-color:var(--sol)}
.pdone{background:var(--sol-tint);color:var(--sol);padding:18px;border-radius:16px;font-weight:700;font-size:18px;text-align:center}</style></head>
<body class="phone"><header><span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22V9" style="stroke:#161616" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M12 13C12 9 15 6 20 6c0 4-3 7-8 7z" style="fill:#2E7D5B"/><path d="M12 10C12 6.5 9.5 4 5 4c0 3.5 2.5 6 7 6z" style="fill:#C2432D"/><circle cx="12" cy="22" r="1.8" style="fill:#B5852B"/></svg>Harvest</span><span class="spacer"></span><button class="ghost" id="langBtn" type="button">EN</button></header><main id="main"></main>
<script>
const T={"en": {"loading": "Loading…", "noSession": "This session was not found. Ask the facilitator for a new QR code.", "saveAll": "Save our 5 things", "savedAll": "Saved ✓ Thank you!", "optional": "(if you remember)", "otherChar": "+ Other character…", "pickGroup": "Which group are you?", "groupGone": "Your group was removed by the facilitator. Choose a group below.", "yourGroup": "Your group", "rename": "Rename group", "round2T": "Round 2: problems and solutions", "solHelp": "Add solutions and new problems. For a solution, choose the problem or problems it answers.", "rootsPick": "Answers the problem", "noRootsYet2": "The roots are not ready yet. Wait a moment.", "phoneHelp": "Write the 5 things from the simulation that stayed in your mind. For each one: the role (institution and character), problem or solution.", "leafPh": "What stayed in your mind…", "role": "Role", "person": "Character in the simulation", "personPh": "e.g. the Mayor", "kind": "It is", "problem": "Problem", "solution": "Solution", "saving": "Saving…", "savedOk": "Sent ✓", "notSent": "Not sent. Check the internet, it will retry.", "done": "Thank you! Your 5 leaves are on the tree. Look at the screen."}, "pl": {"loading": "Ładowanie…", "noSession": "Nie znaleziono tej sesji. Poproś prowadzącego o nowy kod QR.", "saveAll": "Zapisz nasze 5 rzeczy", "savedAll": "Zapisane ✓ Dziękujemy!", "optional": "(jeśli pamiętacie)", "otherChar": "+ Inna postać…", "pickGroup": "Która to grupa?", "groupGone": "Prowadzący usunął Waszą grupę. Wybierzcie grupę poniżej.", "yourGroup": "Twoja grupa", "rename": "Zmień nazwę grupy", "round2T": "Runda 2: problemy i rozwiązania", "solHelp": "Dopiszcie rozwiązania i nowe problemy. Przy rozwiązaniu wybierzcie problem lub problemy, na które odpowiada.", "rootsPick": "Odpowiada na problem", "noRootsYet2": "Korzenie nie są jeszcze gotowe. Chwilę cierpliwości.", "phoneHelp": "Zapiszcie 5 rzeczy z symulacji, które zostały Wam w głowie. Przy każdej: rola (instytucja i postać), problem czy rozwiązanie.", "leafPh": "Co zostało w głowie…", "role": "Rola", "person": "Postać w symulacji", "personPh": "np. Pani Burmistrz", "kind": "To jest", "problem": "Problem", "solution": "Rozwiązanie", "saving": "Zapisuję…", "savedOk": "Wysłane ✓", "notSent": "Nie wysłano. Sprawdź internet, spróbuję ponownie.", "done": "Dziękujemy! Wasze 5 liści jest już na drzewie. Spójrzcie na ekran."}};
const SB_URL="https://tnvqrxbqrsajlekdudug.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRudnFyeGJxcnNhamxla2R1ZHVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzODc3NjksImV4cCI6MjEwODk2Mzc2OX0.j-MXrCBEcEUtpeW03P-lUlIiAA9l57i80QjLTEjCdNM";
const $=id=>document.getElementById(id);
function el(tag,a={},...kids){const n=document.createElement(tag);for(const[k,v]of Object.entries(a)){if(k==="class")n.className=v;else if(k==="style")n.style.cssText=v;else if(k==="html")n.innerHTML=v;else if(k.startsWith("on"))n.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)n.setAttribute(k,v===true?"":v)}for(const c of kids.flat())if(c!=null&&c!==false)n.append(c.nodeType?c:document.createTextNode(String(c)));return n}
async function rpc(name,args){const r=await fetch(`${SB_URL}/rest/v1/rpc/${name}`,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(args)});
 if(!r.ok)throw new Error(name+" "+r.status);const tx=await r.text();return tx?JSON.parse(tx):null}
/* character picker: the role's characters (or all, grouped by role); picking one also sets the role; "other" lets you type */
function charSelect(roles,roleId,person,onPick,tt){const list=roles.filter(r=>(!roleId||r.id===roleId)&&(r.persons||[]).length);
 const has=list.some(r=>r.persons.includes(person)&&(!roleId||r.id===roleId));const other=!!person&&!has;
 const opts=[el("option",{value:""},"—")];
 if(roleId){const r=list[0];if(r)r.persons.forEach(p=>opts.push(el("option",{value:r.id+"::"+p,selected:p===person},p)))}
 else list.forEach(r=>opts.push(el("optgroup",{label:r.name},...r.persons.map(p=>el("option",{value:r.id+"::"+p,selected:p===person},p)))));
 opts.push(el("option",{value:"__other",selected:other},tt("otherChar")));
 const inp=el("input",{value:other?person:"",placeholder:tt("personPh"),hidden:!other,oninput:e=>onPick(roleId,e.target.value.trim(),false),onchange:e=>onPick(roleId,e.target.value.trim(),true)});
 const sel=el("select",{onchange:e=>{const v=e.target.value;if(v==="__other"){inp.hidden=false;inp.focus();return}inp.hidden=true;inp.value="";if(!v){onPick(roleId,"");return}const i=v.indexOf("::");onPick(v.slice(0,i),v.slice(i+2))}},...opts);
 return el("span",{class:"charsel"},sel,inp)}
async function groupApp(sid,gid){
 document.body.classList.add("phone");const m=$("main");const P={cfg:null,lang:"pl",leaves:{},st:{}};
 const tt=k=>(T[P.lang]||T.en)[k]??T.en[k];
 m.replaceChildren(el("p",{class:"muted",style:"text-align:center;padding:40px"},tt("loading")));
 try{P.cfg=await rpc("kds_session_get",{p_id:sid})}catch(e){}
 if(!P.cfg){m.replaceChildren(el("div",{class:"card empty"},el("p",{},tt("noSession"))));return}
 P.lang=P.cfg.lang||"pl";try{const l=localStorage.getItem("harvest-kds.lang");if(l)P.lang=l}catch(e){}
 let groups=P.cfg.groups||[];let roles=P.cfg.roles||[];
 $("langBtn").onclick=()=>{P.lang=P.lang==="en"?"pl":"en";try{localStorage.setItem("harvest-kds.lang",P.lang)}catch(e){}draw()};
 const setG=id=>{gid=id;P.removed=false;try{localStorage.setItem("harvest-kds.g."+sid,id)}catch(e){}const u=new URL(location.href);if(id)u.searchParams.set("g",id);else u.searchParams.delete("g");history.replaceState(null,"",u);if(id)loadMine();else draw()};
 async function loadMine(){P.leaves={};try{(await rpc("kds_group_leaves",{p_session:sid,p_group:gid})||[]).forEach(r=>P.leaves[r.slot]={text:r.text,role:r.role_id||"",person:r.person,kind:r.kind||"",roots:r.root_ids||[]})}catch(e){}draw();watch()}
 async function watch(){clearTimeout(P.wt);try{const c=await rpc("kds_session_get",{p_id:sid});if(c){const a=JSON.stringify([P.cfg.stage,P.cfg.roots,P.cfg.roles]),b=JSON.stringify([c.stage,c.roots,c.roles]);const stageChanged=c.stage!==P.cfg.stage;P.cfg=c;if(gid&&!(c.groups||[]).some(x=>x.id===gid)){groups=c.groups||[];gid="";P.removed=true;draw();P.wt=setTimeout(watch,5000);return}if(a!==b){const ae=document.activeElement;if(stageChanged||!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))draw()}}}catch(e){}P.wt=setTimeout(watch,5000)}
 const timers={};
 function send(slot,now){clearTimeout(timers[slot]);P.st[slot]="saving";mark(slot);timers[slot]=setTimeout(async()=>{const L=P.leaves[slot];
  try{await rpc("kds_leaf_save",{p_session:sid,p_group:gid,p_slot:slot,p_text:L.text||"",p_role:L.role||"",p_person:L.person||"",p_kind:L.kind||"",p_roots:L.roots||[]});P.st[slot]="ok"}catch(e){P.st[slot]="err";timers[slot]=setTimeout(()=>send(slot),4000)}
  mark(slot);progress()},now?0:650)}
 function mark(slot){const s=document.querySelector(`[data-st="${slot}"]`);if(!s)return;const st=P.st[slot];s.className="pst "+(st||"");s.textContent=st==="saving"?tt("saving"):st==="ok"?tt("savedOk"):st==="err"?tt("notSent"):""}
 const SL=()=>P.cfg.stage==="solutions"?[6,7,8,9,10]:[1,2,3,4,5];
 function progress(){const n=SL().filter(i=>(P.leaves[i]?.text||"").trim()&&P.st[i]!=="err"&&P.st[i]!=="saving").length;const p=$("pprog");if(p){p.querySelector("b").textContent=n+"/5";p.querySelector("i").style.width=(n*20)+"%"}
  const d=$("pdone");if(d)d.hidden=n<5}
 function renameUI(g){const box=document.querySelector(".pgroup");const inp=el("input",{value:g.name,maxlength:"40",style:"flex:1"});
  const done=async()=>{const v=inp.value.trim();if(v&&v!==g.name){try{if(await rpc("kds_group_rename",{p_session:sid,p_group:gid,p_name:v}))g.name=v}catch(e){}}draw()};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")done();if(e.key==="Escape")draw()});box.replaceChildren(inp,el("button",{type:"button",onclick:done},"OK"));inp.focus();inp.select()}
 function draw(){document.documentElement.lang=P.lang;$("langBtn").textContent=P.lang==="en"?"PL":"EN";
  const head=el("div",{class:"phead"},el("p",{class:"eyebrow"},"Harvest · KDS"),el("h1",{class:"ptitle"},P.cfg.title||"Harvest"));
  const g=groups.find(x=>x.id===gid);
  if(!g){let mine="";try{mine=localStorage.getItem("harvest-kds.g."+sid)||""}catch(e){}const list=groups.slice().sort((a,b)=>(b.id===mine)-(a.id===mine));
   m.replaceChildren(head,P.removed?el("div",{class:"card"},el("p",{style:"margin:0;font-weight:600"},tt("groupGone"))):"",el("div",{class:"card"},el("h2",{},tt("pickGroup")),el("div",{class:"pgroups"},...list.map(x=>el("button",{type:"button",class:x.id===mine?"mine":"",onclick:()=>setG(x.id)},x.name,x.id===mine?el("small",{},tt("yourGroup")):null)))));return}
  roles=P.cfg.roles||[];const sol=P.cfg.stage==="solutions",roots=P.cfg.roots||[];
  const rows=SL().map(slot=>{const L=P.leaves[slot]||(P.leaves[slot]={text:"",role:"",person:"",kind:"",roots:[]});L.roots=L.roots||[];const role=roles.find(r=>r.id===L.role);
   const seg=k=>el("button",{type:"button",class:"seg "+k,"aria-pressed":String(L.kind===k),onclick:e=>{L.kind=L.kind===k?"":k;e.target.parentNode.querySelectorAll(".seg").forEach(b=>b.setAttribute("aria-pressed",String(b.classList.contains(L.kind)&&!!L.kind)));e.target.closest(".lrow").className="lrow"+(L.kind?" k-"+L.kind:"");send(slot)}},tt(k));
   const dl="pdl"+slot;
   return el("div",{class:"lrow"+(L.kind?" k-"+L.kind:"")},el("div",{class:"num"},slot>5?slot-5:slot),
    el("div",{class:"lbody"},el("textarea",{rows:"2",maxlength:"220",placeholder:tt("leafPh"),oninput:e=>{L.text=e.target.value;send(slot)}},L.text),
     el("div",{class:"lmeta"},
      el("label",{class:"mini"},tt("role"),el("select",{onchange:e=>{L.role=e.target.value;send(slot);draw()}},el("option",{value:""},"—"),...roles.map(r=>el("option",{value:r.id,selected:L.role===r.id},r.name)))),
      el("label",{class:"mini"},tt("person")+" "+tt("optional"),charSelect(roles,L.role,L.person,(rid,p)=>{const ch=!!rid&&rid!==L.role;if(rid)L.role=rid;L.person=p;send(slot);if(ch)draw()},tt)),
      el("div",{class:"mini"},el("span",{},tt("kind")),el("div",{class:"segs"},seg("problem"),seg("solution")))),
     sol?el("div",{class:"mini"},el("span",{},tt("rootsPick")),el("div",{class:"rootpick"},...roots.map(r=>el("button",{type:"button","aria-pressed":String(L.roots.includes(r.id)),onclick:e=>{L.roots=L.roots.includes(r.id)?L.roots.filter(i=>i!==r.id):[...L.roots,r.id];e.currentTarget.setAttribute("aria-pressed",String(L.roots.includes(r.id)));send(slot)}},r.name)))):null,
     el("span",{class:"pst","data-st":slot})))});
  m.replaceChildren(...[head,
   el("div",{class:"pgroup"},el("span",{class:"pgname"},g.name),el("button",{class:"ghost",type:"button",onclick:()=>renameUI(g)},"✎ "+tt("rename"))),
   sol?el("h2",{},tt("round2T")):null,
   el("div",{class:"help"},el("span",{},sol?tt("solHelp"):tt("phoneHelp"))),
   sol&&!roots.length?el("div",{class:"card"},el("p",{style:"margin:0"},tt("noRootsYet2"))):null,
   el("div",{class:"five"},...rows),
   el("div",{class:"pprog",id:"pprog"},el("b",{},"0/5"),el("span",{class:"pbar"},el("i"))),
   (()=>{const b=el("button",{type:"button",class:"primary savebig",onclick:()=>{const slots=SL().filter(i=>(P.leaves[i]?.text||"").trim());slots.forEach(i=>send(i,true));
     b.textContent=tt("saving");setTimeout(()=>{const bad=slots.some(i=>P.st[i]==="err");b.textContent=bad?tt("notSent"):tt("savedAll");b.classList.toggle("ok",!bad)},1400)}},tt("saveAll"));return b})(),
   el("div",{class:"pdone",id:"pdone",hidden:true},tt("done"))].filter(Boolean));
  SL().forEach(i=>{if((P.leaves[i].text||"").trim()&&!P.st[i])P.st[i]="ok";mark(i)});progress()}
 if(gid&&groups.some(x=>x.id===gid)){try{localStorage.setItem("harvest-kds.g."+sid,gid)}catch(e){}loadMine()}else{gid="";draw()}}

const QS=new URLSearchParams(location.search);
if(QS.get("s"))groupApp(QS.get("s"),QS.get("g")||"");
else $("main").replaceChildren(el("div",{class:"card empty"},el("h2",{},"Harvest KDS"),el("p",{class:"muted"},"Zeskanuj kod QR swojej grupy. / Scan your group's QR code.")));
</script></body></html>
